

<h2 mat-dialog-title class="dialog-title">
    <mat-icon *ngIf="data.icon">
        {{ data.icon }}
    </mat-icon>

    {{ data.title }}
</h2>

<mat-dialog-content>
    {{ data.message }}
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button (click)="cancel()">
        {{ data.cancelText || 'Cancel' }}
    </button>

    <button mat-raised-button color="primary"
            (click)="confirm()">
        {{ data.confirmText }}
    </button>
</mat-dialog-actions>
