<mat-toolbar color="primary">
  <button mat-icon-button (click)="goToEmpDashboard()">
    <mat-icon>arrow_back</mat-icon>
  </button>

  <span>Part Inventory</span>

  <span class="spacer"></span>

  <button mat-raised-button color="accent"
          (click)="navigationToAddPart()">
    Add Part
  </button>
</mat-toolbar>

<app-part-list-view
  [parts]="parts"
  (edit)="editPart($event)"
  (delete)="deletePart($event)">
</app-part-list-view>
